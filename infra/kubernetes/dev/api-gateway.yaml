apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: heygo
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: heygo/api-gateway:0.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: HTTP_ADDR
          valueFrom:
            configMapKeyRef:
              name: heygo-config
              key: http-addr
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: heygo-config
              key: exporter-endpoint
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: postgres
              key: url
        - name: INTERNAL_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: postgres
              key: internal-service-token
        - name: OTP_PEPPER
          valueFrom:
            secretKeyRef:
              name: phone-auth
              key: otp-pepper
        - name: SMS_PROVIDER_TOKEN
          valueFrom:
            secretKeyRef:
              name: phone-auth
              key: sms-provider-token
              optional: true
        - name: HEYGO_ADMIN_SETTINGS_KEY
          valueFrom:
            secretKeyRef:
              name: phone-auth
              key: admin-settings-key
        - name: HEYGO_MONNIFY_REFUNDS_READY
          value: "false"
        - name: SMS_PROVIDER_URL
          valueFrom:
            configMapKeyRef:
              name: heygo-config
              key: sms-provider-url
        - name: SMS_SENDER_ID
          valueFrom:
            configMapKeyRef:
              name: heygo-config
              key: sms-sender-id
        - name: ALLOWED_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: heygo-config
              key: allowed-origins
        - name: GCP_PROJECT_ID
          valueFrom: {configMapKeyRef: {name: heygo-config, key: gcp-project-id}}
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: heygo
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
    name: http

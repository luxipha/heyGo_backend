groups:
  - name: heygo-backend
    rules:
      - alert: HeyGoPaymentEventBacklog
        expr: heygo_payment_events_pending > 0 and heygo_payment_events_oldest_age_seconds > 300
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "Payment webhook publication backlog is aging; inspect recovery job and Pub/Sub"}
      - alert: HeyGoPaymentEventEnvelopeMissing
        expr: heygo_payment_events_unrecoverable > 0
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "Legacy payment events need operator investigation; do not mark published without delivery evidence"}
      - alert: HeyGoPaymentEventBacklogReadFailed
        expr: heygo_payment_events_backlog_read_success == 0
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Payment event backlog cannot be read"}
      - alert: HeyGoHighHTTPErrorRate
        expr: sum(rate(heygo_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(heygo_http_requests_total[5m])), 1) > 0.05
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "HeyGo HTTP 5xx rate exceeds 5%"}
      - alert: HeyGoHighHTTPP95Latency
        expr: histogram_quantile(0.95, sum by (le,service) (rate(heygo_http_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "HeyGo HTTP p95 latency exceeds one second"}
      - alert: HeyGoServiceDown
        expr: up{job=~"heygo-.*"} == 0
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "A HeyGo backend target is down"}

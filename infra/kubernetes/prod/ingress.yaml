apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: heygo-api
  namespace: heygo
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.heygo.example.com]
      secretName: heygo-api-tls
  rules:
    - host: api.heygo.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080

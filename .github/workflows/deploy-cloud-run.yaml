name: Deploy Cloud Run

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Full Git commit SHA with passing audit and published service/migration images
        required: true
        type: string
      include_ride_agent:
        description: Also deploy the already-provisioned Ride Agent service
        required: false
        default: false
        type: boolean
      backup_id:
        description: Reviewed successful heygo-postgres backup ID (verify before dispatch)
        required: true
        type: string
      confirmation:
        description: Type deploy to confirm the production rollout
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloud-run-production
  cancel-in-progress: false

env:
  PROJECT_ID: heygo-ng
  REGION: europe-west1
  REGISTRY: europe-west1-docker.pkg.dev/heygo-ng/heygo
  DEPLOYER: github-cloud-run-deployer@heygo-ng.iam.gserviceaccount.com

jobs:
  deploy:
    name: Deploy immutable images
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'deploy'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Require successful checks for the exact selected commit
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          test "$IMAGE_TAG" = "$GITHUB_SHA"
          for workflow in audit.yaml cloud-run-images.yaml; do
            conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$IMAGE_TAG&branch=main&event=push&per_page=10" --jq '.workflow_runs[0].conclusion')"
            test "$conclusion" = success
          done

      - name: Select only provisioned release services
        env:
          INCLUDE_RIDE_AGENT: ${{ inputs.include_ride_agent }}
        run: |
          services="driver-service trip-service payment-service"
          if [[ "$INCLUDE_RIDE_AGENT" == true ]]; then
            services="$services ride-agent-gateway"
          fi
          echo "RELEASE_SERVICES=$services api-gateway" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: heygo-ng
          workload_identity_provider: projects/392496443029/locations/global/workloadIdentityPools/github-actions/providers/heygo-backend
          service_account: github-cloud-run-deployer@heygo-ng.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Validate release inputs and prerequisites
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "image_tag must be a full lowercase Git SHA" >&2
            exit 1
          fi
          for service in $RELEASE_SERVICES; do
            gcloud artifacts docker images describe "$REGISTRY/$service:$IMAGE_TAG" --project="$PROJECT_ID" >/dev/null
            gcloud run services describe "$service" --project="$PROJECT_ID" --region="$REGION" >/dev/null
          done
          gcloud artifacts docker images describe "$REGISTRY/migration:$IMAGE_TAG" --project="$PROJECT_ID" >/dev/null
          gcloud run jobs describe heygo-migration --project="$PROJECT_ID" --region="$REGION" >/dev/null

      - name: Record reviewed backup and retain rollback evidence
        env:
          BACKUP_ID: ${{ inputs.backup_id }}
        run: |
          [[ "$BACKUP_ID" =~ ^[0-9]+$ ]]
          mkdir -p release-evidence
          # CI has run.admin but no Cloud SQL backup-reader grant. The operator
          # preflight verifies the actual backup; retain its reference here.
          printf '{"reviewedBackupId":"%s"}\n' "$BACKUP_ID" > release-evidence/backup-reference.json
          for service in $RELEASE_SERVICES; do
            gcloud run services describe "$service" --project="$PROJECT_ID" --region="$REGION" --format=json |
              jq '{service: .metadata.name, image: .spec.template.spec.containers[0].image, traffic: .status.traffic, url: .status.url}' > "release-evidence/$service-before.json"
          done

      - name: Upload rollback evidence before migrations
        uses: actions/upload-artifact@v4
        with:
          name: production-rollback-${{ inputs.image_tag }}
          path: release-evidence/

      - name: Run database migrations
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          gcloud run jobs update heygo-migration \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="$REGISTRY/migration:$IMAGE_TAG" \
            --quiet
          gcloud run jobs execute heygo-migration \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --wait \
            --quiet

      - name: Create candidate revisions with no production traffic
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          CANDIDATE_TAG="candidate-${IMAGE_TAG:0:12}"
          for service in $RELEASE_SERVICES; do
            gcloud run services update "$service" \
              --project="$PROJECT_ID" \
              --region="$REGION" \
              --image="$REGISTRY/$service:$IMAGE_TAG" \
              --tag="$CANDIDATE_TAG" \
              --no-traffic \
              --quiet
          done
          echo "CANDIDATE_TAG=$CANDIDATE_TAG" >> "$GITHUB_ENV"

      - name: Check public candidate readiness
        run: |
          for service in payment-service api-gateway; do
            candidate_url="$(
              gcloud run services describe "$service" \
                --project="$PROJECT_ID" \
                --region="$REGION" \
                --format=json |
                jq -r --arg tag "$CANDIDATE_TAG" '.status.traffic[] | select(.tag == $tag) | .url'
            )"
            test -n "$candidate_url"
            curl --fail --silent --show-error \
              --retry 12 --retry-all-errors --retry-delay 5 \
              "$candidate_url/ready"
          done

      - name: Check protected Ride Agent candidate health
        if: inputs.include_ride_agent
        run: |
          service_json="$(gcloud run services describe ride-agent-gateway --project="$PROJECT_ID" --region="$REGION" --format=json)"
          audience="$(jq -r '.status.url' <<< "$service_json")"
          candidate_url="$(jq -r --arg tag "$CANDIDATE_TAG" '.status.traffic[] | select(.tag == $tag) | .url' <<< "$service_json")"
          test -n "$audience" && test "$audience" != null
          test -n "$candidate_url" && test "$candidate_url" != null
          identity_token="$(gcloud auth print-identity-token --impersonate-service-account="$DEPLOYER" --audiences="$audience" --include-email)"
          echo "::add-mask::$identity_token"
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            --header "Authorization: Bearer $identity_token" "$candidate_url/health"

      - name: Promote verified candidate revisions
        run: |
          for service in $RELEASE_SERVICES; do
            candidate_revision="$(
              gcloud run services describe "$service" \
                --project="$PROJECT_ID" \
                --region="$REGION" \
                --format=json |
                jq -r --arg tag "$CANDIDATE_TAG" '.status.traffic[] | select(.tag == $tag) | .revisionName'
            )"
            test -n "$candidate_revision"
            gcloud run services update-traffic "$service" \
              --project="$PROJECT_ID" \
              --region="$REGION" \
              --to-revisions="$candidate_revision=100" \
              --quiet
            gcloud run services update-traffic "$service" \
              --project="$PROJECT_ID" \
              --region="$REGION" \
              --remove-tags="$CANDIDATE_TAG" \
              --quiet
          done

      - name: Verify promoted public readiness
        run: |
          for service in payment-service api-gateway; do
            url="$(gcloud run services describe "$service" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
            curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 "$url/ready"
          done

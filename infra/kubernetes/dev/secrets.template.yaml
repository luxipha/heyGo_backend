apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: heygo
type: Opaque
stringData:
  url: "postgres://<user>:<password>@<host>:5432/<database>?sslmode=require"
  internal-service-token: "<generate-a-long-random-token>"
---
apiVersion: v1
kind: Secret
metadata:
  name: phone-auth
  namespace: heygo
type: Opaque
stringData:
  otp-pepper: "<generate-at-least-32-random-bytes>"
  admin-settings-key: "<generate-64-hex-characters>"
  sms-provider-token: "<optional_sms_adapter_token>"
---
apiVersion: v1
kind: Secret
metadata:
  name: external-apis
  namespace: heygo
type: Opaque
stringData:
  osrm: "http://router.project-osrm.org/route/v1/driving"
---
apiVersion: v1
kind: Secret
metadata:
  name: moniepoint
  namespace: heygo
type: Opaque
stringData:
  api-key: "<your_monnify_api_key>"
  secret-key: "<your_monnify_secret_key>"
  contract-code: "<your_monnify_contract_code>"
